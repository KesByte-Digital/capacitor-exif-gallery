// Public-release variant: wraps the prebuilt exifgallery-release.aar instead of
// compiling android/src/main directly (no Kotlin source ships in the public repo).
// The CI release workflow copies this file to the public repo as `android/build.gradle`
// (substituting 1.2.0 below), alongside the .aar under `android/libs/` and a local
// Maven repo under `android/libs-repo/` (both generated by scripts/build-android-aar.sh).
//
// android/src/main here contains ONLY a text-only Capacitor CLI registration hint (see
// android-public/src/main/java/com/kesbytedigital/exifgallery/ExifGalleryPluginRegistrationHint.java
// for why it has to exist at all) - excluded from compilation below via sourceSets.
//
// The .aar is consumed as a Maven coordinate resolved from that local repo, not via
// `flatDir` or `files(...)`:
// - `flatDir` carries no POM metadata, so transitive dependencies of the .aar are not
//   resolved automatically (they would silently be missing from the final app's runtime
//   classpath).
// - `implementation files('libs/exifgallery-release.aar')` is rejected outright by AGP
//   for a module that itself produces an .aar: "Direct local .aar file dependencies are
//   not supported when building an AAR."
// A local Maven repo's POM is also now the single source of truth for this module's
// transitive dependencies - keep it in sync with the private, source-compiling
// android/build.gradle when adding a dependency there (see that file's own dependencies
// block and scripts/build-android-aar.sh's POM generation).
//
// Gradle repository declarations are scoped to the DECLARING project only, so a plain
// `repositories { maven { ... } }` block here is invisible when the consuming app's
// `:app` project transitively resolves this module's dependencies (verified empirically -
// `:app:checkDebugAarMetadata` fails to find the artifact otherwise). Reaching into
// `rootProject.allprojects` below is the workaround: it mutates the root project's
// repository configuration, which - unlike a subproject's own `repositories{}` - other
// subprojects' resolution does see, regardless of project evaluation order (repository
// declarations only need to be present by the time dependency *resolution* happens, which
// is after every project has finished *configuring*).

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.kesbytedigital.exifgallery"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets {
        main {
            java.srcDirs = []
        }
    }
}

def localAarRepoDir = "${projectDir}/libs-repo"
rootProject.allprojects {
    repositories {
        maven { url uri(localAarRepoDir) }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.kesbytedigital.exifgallery:exifgallery-release:1.2.0"
    implementation project(':capacitor-android')
}
